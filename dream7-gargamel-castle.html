<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第七梦：格格巫的噩梦城堡 - 蓝精灵梦境大冒险</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1a2e;
  --card: #1e1e3a;
  --accent: #6d28d9;
  --accent-light: #8b5cf6;
  --accent-glow: rgba(109,40,217,.4);
  --text: #e0dce8;
  --text-muted: #9ca3af;
  --gold: #f59e0b;
  --success: #10b981;
  --danger: #ef4444;
}

body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  background: linear-gradient(180deg, #1a1a2e 0%, #16213e 40%, #1a1a2e 100%);
  min-height: 100vh;
  color: var(--text);
  overflow-x: hidden;
}

/* ========== NAVIGATION ========== */
.nav {
  display: flex;
  justify-content: center;
  gap: 0;
  padding: 16px 16px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(180deg, #1a1a2e 0%, #1a1a2e 80%, transparent 100%);
}
.nav button {
  padding: 12px 36px;
  font-size: 18px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
}
.nav button:first-child { border-radius: 16px 0 0 16px; }
.nav button:last-child { border-radius: 0 16px 16px 0; }
.nav button.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 16px var(--accent-glow);
  transform: translateY(-2px);
}
.nav button:not(.active) {
  background: var(--card);
  color: var(--accent-light);
  border: 2px solid var(--accent);
}

/* ========== PAGE SECTIONS ========== */
.page { display: none; }
.page.visible { display: block; }

/* ========== HERO ========== */
.hero {
  text-align: center;
  padding: 32px 20px 24px;
}
.hero .icon {
  font-size: 72px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
.hero h1 {
  font-size: 30px;
  color: var(--accent-light);
  margin-top: 8px;
  letter-spacing: 1px;
}
.hero .subtitle {
  font-size: 16px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ========== CARDS ========== */
.card {
  background: var(--card);
  border-radius: 20px;
  padding: 24px;
  margin: 0 16px 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
  border: 1px solid rgba(255,255,255,.06);
}
.card h2 {
  font-size: 22px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--accent-light);
}
.card h3 {
  font-size: 18px;
  margin: 16px 0 8px;
  color: #c4b5e3;
}

/* ========== STORY BOX ========== */
.story-box {
  background: linear-gradient(135deg, #2d1b4e, #1e1e3a);
  border-left: 4px solid var(--accent);
  padding: 16px 20px;
  border-radius: 0 12px 12px 0;
  font-size: 15px;
  line-height: 1.8;
  margin-bottom: 20px;
}

/* ========== REWARD BOX ========== */
.reward-box {
  display: flex;
  align-items: center;
  gap: 12px;
  background: linear-gradient(135deg, #2d2416, #1e1e3a);
  border-radius: 16px;
  padding: 18px 20px;
  margin-top: 16px;
}
.reward-box .item-emoji { font-size: 48px; }
.reward-box .item-name { font-size: 20px; font-weight: 700; }
.reward-box .item-desc { font-size: 14px; color: var(--text-muted); }

/* ========== STEPS LIST ========== */
.steps-list {
  list-style: none;
  counter-reset: step;
}
.steps-list li {
  counter-increment: step;
  padding: 12px 12px 12px 48px;
  position: relative;
  font-size: 15px;
  line-height: 1.7;
}
.steps-list li::before {
  content: counter(step);
  position: absolute;
  left: 8px;
  top: 10px;
  width: 28px;
  height: 28px;
  background: var(--accent);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
}

/* ========== BUTTONS ========== */
.btn {
  display: inline-block;
  padding: 14px 36px;
  font-size: 16px;
  font-weight: 700;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 6px 20px var(--accent-glow);
}
.btn-success {
  background: var(--success);
  color: #fff;
  box-shadow: 0 6px 20px rgba(16,185,129,.3);
}
.btn-gold {
  background: var(--gold);
  color: #1a1a2e;
  box-shadow: 0 6px 20px rgba(245,158,11,.3);
}
.btn-sm {
  padding: 10px 24px;
  font-size: 14px;
}

/* ========== FOCUS VISIBLE ========== */
.btn:focus-visible, .nav button:focus-visible {
  outline: 3px solid var(--accent-light);
  outline-offset: 2px;
}

/* ========== INVENTORY BAR ========== */
.inventory-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  padding: 12px 16px;
  margin: 0 16px 16px;
  background: var(--card);
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,.3);
  min-height: 48px;
  align-items: center;
}
.inventory-bar .inv-label {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 700;
  margin-right: 4px;
}
.inventory-bar .inv-item {
  font-size: 28px;
  cursor: pointer;
  position: relative;
  transition: transform .2s;
}
.inventory-bar .inv-item:hover { transform: scale(1.2); }
.inventory-bar .inv-item .tooltip {
  display: none;
  position: absolute;
  bottom: 110%;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 8px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 10;
}
.inventory-bar .inv-item:hover .tooltip { display: block; }
.inventory-bar .empty {
  font-size: 13px;
  color: #555;
}

/* ========== BOSS STAGE ========== */
.boss-stage {
  text-align: center;
  padding: 20px;
  position: relative;
}

/* ========== VICTORY ========== */
.victory { display: none; text-align: center; padding: 30px 20px; animation: popIn .5s ease-out; }
.victory.show { display: block; }
.victory .trophy { font-size: 80px; }
.victory h2 { font-size: 28px; color: var(--success); margin: 12px 0; }
.victory p { font-size: 16px; color: var(--text-muted); margin: 8px 0; }

@keyframes popIn {
  0% { transform: scale(.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* ========== RESPONSIVE ========== */
@media (min-width: 600px) {
  .card { max-width: 560px; margin: 0 auto 20px; }
  .story-box, .reward-box, .steps-list { max-width: 560px; margin-left: auto; margin-right: auto; }
}

/* ========== PREFERS REDUCED MOTION ========== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ========== PRINT ========== */
.print-only { display: none; }
@media print {
  body { background: #fff; color: #333; }
  .nav, .boss-page-elements { display: none; }
  .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; background: #fff; }
  .card h2 { color: #333; }
  .story-box { background: #f5f5f5; border-left-color: #999; }
  .print-only { display: block; font-size: 12px; color: #999; text-align: center; margin-top: 20px; }
}
</style>
</head>
<body>

<!-- ===== NAVIGATION ===== -->
<div class="nav">
  <button id="btn-rules" class="active" onclick="showPage('rules')">📋 游戏规则</button>
  <button id="btn-boss" onclick="showPage('boss')">👾 Boss 战</button>
</div>

<!-- ===== RULES PAGE ===== -->
<div id="page-rules" class="page visible">

  <div class="hero">
    <div class="icon">🏰</div>
    <h1>第七梦：格格巫的噩梦城堡</h1>
    <p class="subtitle">蓝精灵梦境大冒险 · 5～6 岁 · 1 位小玩家 + 1 位家长</p>
  </div>

</div>

<!-- ===== BOSS PAGE ===== -->
<div id="page-boss" class="page">

  <div class="hero">
    <div class="icon">👾</div>
    <h1>Boss 战：格格巫的噩梦城堡</h1>
    <p class="subtitle">勇敢的小蓝精灵，战胜格格巫的噩梦吧！</p>
  </div>

  <!-- Inventory bar -->
  <div class="inventory-bar" id="inventory-bar">
    <span class="inv-label">🎒 道具包：</span>
    <span class="empty" id="inv-empty">空空如也，打败 Boss 获得道具！</span>
  </div>

  <div class="boss-stage" id="boss-stage">
  </div>

</div>

<script>
// ===== ITEM DESCRIPTIONS =====
const ITEM_DESCRIPTIONS = {
  '儿童魔法厨具': '掷骰做料理',
  '魔法手镜': '提前透露障碍类型',
  '勇气勋章': '健健代劳体力活',
  '智慧宝石': '聪聪提示认知题',
  '金色小号': '召唤一位盟友',
  '机械巨兽': '灵灵的好帮手'
};

// ===== INVENTORY (localStorage) =====
function loadInventory() {
  try { return JSON.parse(localStorage.getItem('smurfs_dream_items') || '[]'); }
  catch { return []; }
}

function saveInventory(items) {
  localStorage.setItem('smurfs_dream_items', JSON.stringify(items));
}

function hasItem(name) {
  return loadInventory().some(function(i) { return i.name === name; });
}

function addItem(name, emoji) {
  var items = loadInventory();
  if (items.some(function(i) { return i.name === name; })) return;
  items.push({ name: name, emoji: emoji, ts: Date.now() });
  saveInventory(items);
  renderInventory();
}

function renderInventory() {
  var bar = document.getElementById('inventory-bar');
  var empty = document.getElementById('inv-empty');
  var items = loadInventory();

  bar.querySelectorAll('.inv-item').forEach(function(el) { el.remove(); });

  if (items.length === 0) {
    empty.style.display = 'inline';
    return;
  }

  empty.style.display = 'none';
  items.forEach(function(item) {
    var span = document.createElement('span');
    span.className = 'inv-item';
    span.textContent = item.emoji;
    span.title = item.name;

    var tip = document.createElement('span');
    tip.className = 'tooltip';
    tip.textContent = item.name;
    span.appendChild(tip);

    span.addEventListener('click', function() {
      var desc = ITEM_DESCRIPTIONS[item.name] || '来自梦境冒险的道具';
      alert(item.emoji + ' ' + item.name + '\n' + desc);
    });

    bar.appendChild(span);
  });
}

// ===== PAGE SWITCHING =====
function showPage(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('visible'); });
  document.getElementById('page-' + name).classList.add('visible');
  document.querySelectorAll('.nav button').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('btn-' + name).classList.add('active');
  if (name === 'boss') { renderInventory(); initBoss(); }
}

// ===== BOSS INIT (skeleton) =====
function initBoss() {
  // Reset game state — will be filled in later tasks
  // Placeholder: clear any active timers, reset UI elements, etc.
}

// ===== INIT =====
renderInventory();
</script>

</body>
</html>
